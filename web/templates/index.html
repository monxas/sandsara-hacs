<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandsara Pattern Viewer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏖️ Sandsara Pattern Viewer</h1>
            <p class="subtitle">Visualize and explore sand table patterns</p>
        </header>

        <div class="main-layout">
            <!-- Sidebar: Pattern List -->
            <aside class="sidebar">
                <div class="section">
                    <h2>📂 Patterns</h2>
                    <div id="pattern-list" class="pattern-list">
                        <p class="loading">Loading patterns...</p>
                    </div>
                </div>

                <div class="section">
                    <h2>⚡ Generate Test Patterns</h2>
                    <div class="button-group">
                        <button onclick="generatePattern('circle')" class="btn btn-secondary">Circle</button>
                        <button onclick="generatePattern('spiral')" class="btn btn-secondary">Spiral</button>
                        <button onclick="generatePattern('flower')" class="btn btn-secondary">Flower</button>
                        <button onclick="generatePattern('star')" class="btn btn-secondary">Star</button>
                    </div>
                </div>

                <div class="section">
                    <h2>📤 Upload Pattern</h2>
                    <input type="file" id="file-input" accept=".bin" hidden>
                    <button onclick="document.getElementById('file-input').click()" class="btn btn-primary">
                        Choose .bin file
                    </button>
                    <p id="upload-status" class="status"></p>
                </div>
            </aside>

            <!-- Main: Visualization -->
            <main class="visualization">
                <div class="canvas-container">
                    <canvas id="pattern-canvas" width="600" height="600"></canvas>
                    <div id="no-pattern" class="no-pattern">
                        <p>Select a pattern to visualize</p>
                        <p class="hint">or generate a test pattern →</p>
                    </div>
                </div>

                <div id="pattern-info" class="pattern-info hidden">
                    <h3 id="info-name">Pattern Name</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">Points</span>
                            <span id="info-points" class="value">0</span>
                        </div>
                        <div class="info-item">
                            <span class="label">File Size</span>
                            <span id="info-size" class="value">0 KB</span>
                        </div>
                    </div>
                    <div class="controls">
                        <label>
                            <input type="checkbox" id="animate-toggle"> Animate drawing
                        </label>
                        <button id="replay-btn" class="btn btn-small" disabled>Replay</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
